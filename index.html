<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Chiến sĩ nhí diệt muỗi</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

    <!-- =====================================================================
         CẤU HÌNH NHẠC NỀN  (sửa ngay tại đây)
         1) Đặt file mp3 cùng thư mục với file HTML này
         2) Điền tên file vào BACKGROUND_MUSIC_SRC, ví dụ: "nhac-nen.mp3"
            hoặc đường dẫn con: "nhac/nhac-nen.mp3"
         Để trống "" nếu không muốn dùng nhạc nền.
         ===================================================================== -->
    <script>
        const BACKGROUND_MUSIC_SRC = "background-music.mp3";      // <-- GẮN FILE MP3 VÀO ĐÂY
        const BACKGROUND_MUSIC_VOLUME = 0.4;  // Âm lượng nhạc nền: 0.0 (tắt) -> 1.0 (to nhất)

        // ===== CẤU HÌNH TRÒ CHƠI (sửa ngay tại đây) =====
        const MOSQUITO_IMG = "muoi.png";   // Ảnh con muỗi (đặt cùng thư mục với file HTML này)
        const TARGET = 4;                  // Kết quả cần tìm (số được làm nổi bật trong câu hỏi)
        const START_IMG = "anh-bat-dau.jpg"; // Ảnh minh họa ở màn hình bắt đầu (đặt cùng thư mục với file HTML này)
        const TOAST_MS = 3800;             // Thời gian hiện thông báo "Chưa đúng..." (mili giây)
        const STARS_3_MAX_WRONG = 0;       // Nhầm tối đa bao nhiêu con để được 3 sao (0 = không nhầm con nào)
        const STARS_2_MAX_WRONG = 1;       // Nhầm tối đa bao nhiêu con để được 2 sao (nhầm nhiều hơn = 1 sao)
        const MOSQUITO_SPEED = 1.0;        // Tốc độ bay: 1.0 = mặc định, 0.6 = chậm hơn, 1.5 = nhanh hơn
        // Các phép tính trên mỗi con muỗi (dạng "số + số" hoặc "số - số"). Kết quả được tính tự động.
        const EXPRESSIONS = ["4 - 0", "5 + 1", "2 + 4", "3 + 1", "6 - 2", "4 + 0"];

        // Vị trí khung ghi phép tính trên ảnh con muỗi (tính theo % của ảnh 360x360)
        const LABEL_BOX = { left: 25, top: 54.2, width: 57.8, height: 22.8 };
    </script>

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; margin: 0; }
        body {
            font-family: 'Nunito', system-ui, sans-serif;
            color: #1e293b; background: #bfe9ff; overflow: hidden;
            user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
            touch-action: manipulation; -webkit-text-size-adjust: 100%;
        }
        #app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }

        /* ---------- Thanh trên ---------- */
        header {
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            padding: 6px 14px; background: #16a34a; color: #fff;
            box-shadow: 0 3px 0 #15803d; z-index: 5;
        }
        .brand { font-weight: 900; font-size: clamp(18px, 2.4vw, 30px); letter-spacing: .5px; white-space: nowrap; }
        .tools { display: flex; gap: 6px; }
        .tool {
            width: 34px; height: 34px; border-radius: 10px; border: 0; cursor: pointer; padding: 0;
            background: rgba(255,255,255,.22); color: #fff; display: flex; align-items: center; justify-content: center;
        }
        .tool:hover { background: rgba(255,255,255,.35); }
        .tool svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

        /* ---------- Câu hỏi ---------- */
        #question {
            margin: 10px auto 0; padding: 8px 26px; max-width: calc(100% - 24px);
            background: #fff; border: 4px solid #f59e0b; border-radius: 22px;
            box-shadow: 0 5px 0 #d97706; text-align: center; z-index: 4;
            font-weight: 900; font-size: clamp(20px, 3.1vw, 44px); line-height: 1.3;
        }
        #question .target {
            display: inline-block; min-width: 1.5em; margin: 0 .12em; padding: 0 .3em;
            background: #fde047; color: #dc2626; border-radius: .35em; border: 3px solid #f59e0b;
            font-size: 1.45em; line-height: 1.15; vertical-align: -.08em;
            animation: pulse 1.2s ease-in-out infinite;
        }

        /* ---------- Sân chơi ---------- */
        #field {
            position: relative; flex: 1; margin-top: 8px; overflow: hidden; cursor: crosshair; touch-action: none;
            background: linear-gradient(#bfe9ff 0%, #e6f7ff 60%, #b9f0a0 88%, #7bd957 100%);
        }
        .cloud {
            position: absolute; width: clamp(110px, 12vw, 190px); height: clamp(34px, 3.8vw, 58px);
            background: #fff; border-radius: 999px; opacity: .8; pointer-events: none; animation: drift linear infinite;
        }
        .cloud::before, .cloud::after { content: ''; position: absolute; background: #fff; border-radius: 50%; }
        .cloud::before { width: 42%; height: 120%; left: 14%; bottom: 30%; }
        .cloud::after { width: 32%; height: 90%; left: 46%; bottom: 35%; }

        .muoi { position: absolute; left: 0; top: 0; pointer-events: none; will-change: transform; }
        .muoi-inner { position: relative; width: 100%; animation: bob .5s ease-in-out infinite alternate; }
        .muoi img { width: 100%; display: block; pointer-events: none; filter: drop-shadow(0 6px 5px rgba(0,0,0,.18)); }
        .calc {
            position: absolute; display: flex; align-items: center; justify-content: center; white-space: nowrap;
            font-weight: 900; line-height: 1; color: #0f172a; font-size: calc(var(--w) * .2);
        }
        /* nếu thiếu ảnh: vẽ thân muỗi đơn giản + khung trắng */
        .noimg img { display: none; }
        .noimg::before { content: ''; position: absolute; left: 28%; top: 6%; width: 44%; height: 50%; background: #9ca3af; border-radius: 50%; }
        .noimg .calc { background: #fff; border: 3px solid #111; border-radius: 6px; }
        .muoi.gone .muoi-inner { animation: vanish .6s ease-in forwards; }

        .burst {
            position: absolute; z-index: 3; width: clamp(90px, 10vw, 150px); aspect-ratio: 1; border-radius: 50%; pointer-events: none;
            background: radial-gradient(circle, #fff 0%, #fde047 30%, #fb923c 55%, rgba(251,146,60,0) 70%);
            transform: translate(-50%, -50%); animation: boom .55s ease-out forwards;
        }
        .burst.bad { background: radial-gradient(circle, #fff 0%, #fca5a5 30%, #ef4444 55%, rgba(239,68,68,0) 70%); }
        .pop-text {
            position: absolute; z-index: 3; pointer-events: none; font-weight: 900; color: #15803d; white-space: nowrap;
            font-size: clamp(20px, 2.6vw, 34px); text-shadow: 0 2px 0 #fff, 0 0 6px #fff; animation: floatUp 1.2s ease-out forwards;
        }
        #toast {
            position: absolute; left: 50%; top: 12px; transform: translateX(-50%) translateY(-20px); opacity: 0;
            background: #dc2626; color: #fff; font-weight: 900; border-radius: 16px; padding: 10px 24px; z-index: 6;
            font-size: clamp(10px, 2.5vw, 32px); text-align: center; pointer-events: none; transition: .25s; white-space: nowrap; width: max-content;
            box-shadow: 0 5px 0 #991b1b;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* ---------- Màn hình phủ ---------- */
        .overlay {
            position: absolute; top: 0; right: 0; bottom: 0; left: 0; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center;
            padding: 16px;   /* không làm xám màn hình phía sau */
        }
        .overlay.show { display: flex; }
        .panel {
            background: #fff; border: 5px solid #f59e0b; border-radius: 28px; box-shadow: 0 8px 0 #d97706;
            padding: 22px 34px; max-width: 660px; text-align: center; animation: pop .45s ease;
        }
        .panel h1 { margin: 0 0 6px; font-size: clamp(28px, 4.5vw, 52px); color: #16a34a; line-height: 1.1; }
        .panel h2 { margin: 0 0 4px; font-size: clamp(24px, 3.6vw, 42px); color: #16a34a; line-height: 1.15; }
        .panel p { margin: 8px 0; font-weight: 800; font-size: clamp(15px, 1.9vw, 22px); color: #475569; }
        /* ---------- Màn hình bắt đầu: tiêu đề phía trên, ảnh to bên dưới, nút nổi trên ảnh ---------- */
        #startScreen { container-type: size; padding: 10px; }
        .start-card {
            width: min(100vw - 20px, calc((100vh - 150px) * 1.5));   /* dự phòng cho trình duyệt cũ */
            width: min(100cqw - 20px, calc((100cqh - 20px) * 1.5));
            border: 5px solid #f59e0b; border-radius: 28px; box-shadow: 0 8px 0 #d97706;
            overflow: hidden; background: #7bd957; animation: pop .45s ease;
        }
        .start-pic { position: relative; line-height: 0; width: 100%; aspect-ratio: 3 / 2; background: linear-gradient(#bfe9ff, #7bd957); }
        .start-bg { position: absolute; top: 0; left: 0; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
        .btn.start-btn {
            position: absolute; bottom: 3.5%; left: 50%; margin: 0; transform: translateX(-50%);
            padding: .25em 1.4em; font-size: clamp(18px, 2.5vw, 32px); border: 3px solid #fff; line-height: 1.25;
            animation: btnPulse 1.6s ease-in-out infinite;
        }
        .btn.start-btn:active { animation: none; transform: translateX(-50%) translateY(4px); }

        .btn {
            margin-top: 10px; padding: 12px 38px; border: 0; border-radius: 18px; cursor: pointer;
            background: #f97316; color: #fff; font: inherit; font-weight: 900; font-size: clamp(20px, 2.8vw, 32px);
            box-shadow: 0 6px 0 #c2410c; transition: transform .08s, box-shadow .08s;
        }
        .btn:hover { background: #fb923c; }
        .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #c2410c; }
        /* ---------- Màn hình kết quả (cùng phong cách khung câu hỏi / màn hình bắt đầu) ---------- */
        #endScreen { container-type: size; padding: 10px; }
        #endScreen .panel {
            width: min(100vw - 20px, 940px); max-width: none; max-height: calc(100vh - 150px);   /* dự phòng cho trình duyệt cũ */
            padding: clamp(18px, 5vh, 52px) clamp(18px, 4vw, 56px);
            padding: clamp(18px, 5cqh, 52px) clamp(18px, 4cqw, 56px);
            width: min(100cqw - 20px, 940px); max-height: calc(100cqh - 20px);
            display: flex; flex-direction: column; align-items: center; gap: clamp(12px, 4vh, 36px);
            gap: clamp(12px, 4cqh, 36px);
        }
        .result-stars {
            --s: clamp(64px, min(20vw, 24vh), 180px);   /* dự phòng cho trình duyệt cũ */
            --s: clamp(64px, min(20cqw, 24cqh), 180px);
            display: flex; justify-content: center; align-items: flex-start; gap: calc(var(--s) * .16);
            padding: calc(var(--s) * .16) calc(var(--s) * .2) calc(var(--s) * .14);
        }
        .st { width: var(--s); margin-top: calc(var(--s) * .3); }          /* 2 sao hai bên thấp hơn */
        .st.mid { margin-top: 0; }                                          /* sao ở giữa cao hơn */
        .st svg { width: 100%; height: auto; display: block; overflow: visible; }
        .st .star { fill: #e2e8f0; stroke: #cbd5e1; stroke-width: 6; stroke-linejoin: round; }
        .st.on .star { fill: #fde047; stroke: #f59e0b; }
        .st.on svg { animation: starPop 1s cubic-bezier(.25, .8, .3, 1.1) both; animation-delay: var(--d); }
        .st.off svg { opacity: 0; animation: fadeIn .8s ease both; animation-delay: .2s; }
        /* tia sáng tỏa ra quanh các sao sau khi cả 3 sao đã hiện xong */
        .rays { animation: twinkle 1.8s ease-in-out infinite alternate; animation-delay: calc(var(--rd) + 1s); }
        .ray { fill: none; stroke: #f59e0b; stroke-width: 5; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0;
               animation: rayOut .8s ease-out both; animation-delay: var(--rd); }
        .ray.b { stroke: #fbbf24; }
        .result-msg {
            font-weight: 900; line-height: 1.2; color: #16a34a; text-wrap: balance;
            font-size: clamp(30px, min(7vw, 10vh), 76px);   /* dự phòng cho trình duyệt cũ */
            font-size: clamp(30px, min(7cqw, 12cqh), 76px);
        }
        .result-msg.try { color: #ea580c; }
        .result-sub {
            font-weight: 900; line-height: 1.2; color: #475569;
            font-size: clamp(22px, min(4vw, 6vh), 44px);   /* dự phòng cho trình duyệt cũ */
            font-size: clamp(22px, min(4cqw, 6.5cqh), 44px);
        }
        .result-sub:empty { display: none; }
        .result-sub .num {
            display: inline-block; min-width: 1.4em; margin: 0 .1em; padding: 0 .25em;
            background: #fde047; color: #dc2626; border: 3px solid #f59e0b; border-radius: .35em; line-height: 1.15;
        }
        @keyframes starPop { 0% { transform: scale(0) rotate(-25deg); opacity: 0; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes rayOut { 0% { stroke-dashoffset: 1; opacity: 0; } 20% { opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 1; } }
        @keyframes twinkle { from { opacity: 1; } to { opacity: .45; } }
        @keyframes bob { from { transform: translateY(-5px) rotate(-2deg); } to { transform: translateY(5px) rotate(2deg); } }
        @keyframes btnPulse { 0%,100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.06); } }
        @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
        @keyframes pop { 0% { transform: scale(.85); opacity: 0; } 60% { transform: scale(1.06); } 100% { transform: scale(1); opacity: 1; } }
        @keyframes vanish { 0% { transform: scale(1); opacity: 1; } 35% { transform: scale(1.2) rotate(6deg); opacity: 1; } 100% { transform: translateY(80px) scale(.1) rotate(180deg); opacity: 0; } }
        @keyframes floatUp { 0% { transform: translate(-50%, 0); opacity: 1; } 100% { transform: translate(-50%, -70px); opacity: 0; } }
        @keyframes boom { 0% { transform: translate(-50%, -50%) scale(.3); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; } }
        @keyframes drift { from { transform: translateX(-20vw); } to { transform: translateX(120vw); } }
    </style>
</head>
<body>
<div id="app">
    <header>
        <div class="brand"><span id="secretTap">Chiến</span> sĩ nhí diệt muỗi</div>
        <div class="tools">
            <button class="tool" id="soundBtn" title="Bật/tắt âm thanh" onclick="toggleSound()">
                <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path id="soundWaves" d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/><path id="soundOff" d="M16 9l6 6M22 9l-6 6" style="display:none"/></svg>
            </button>
            <button class="tool" id="fsBtn" title="Toàn màn hình" onclick="toggleFullscreen()">
                <svg viewBox="0 0 24 24"><path id="fsExpand" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/><path id="fsExit" d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" style="display:none"/></svg>
            </button>
        </div>
    </header>

    <div id="question">Hãy diệt con muỗi chứa phép tính có kết quả bằng <span class="target" id="targetNum">4</span></div>

    <main id="field">
        <div id="toast"></div>

        <div id="startScreen" class="overlay show">
            <div class="start-card">
                <div class="start-pic">
                    <img id="startImg" class="start-bg" alt="Các chiến sĩ nhí đuổi muỗi" onerror="this.style.display='none'">
                    <button class="btn start-btn" onclick="startGame()">BẮT ĐẦU</button>
                </div>
            </div>
        </div>

        <div id="endScreen" class="overlay">
            <div class="panel">
                <div class="result-stars" id="endStars"></div>
                <div class="result-sub" id="endSub"></div>
            </div>
        </div>
    </main>

    </div>
</div>

<script>
    // ===================== Âm thanh =====================
    let bgMusic = null;
    let soundOn = true;
    let audioCtx = null;

    function startMusic() {
        if (!BACKGROUND_MUSIC_SRC || !soundOn) return;
        try {
            if (!bgMusic) { bgMusic = new Audio(BACKGROUND_MUSIC_SRC); bgMusic.loop = true; }
            bgMusic.volume = Math.max(0, Math.min(1, BACKGROUND_MUSIC_VOLUME));
            try { bgMusic.currentTime = 0; } catch (e) {}
            const pr = bgMusic.play();
            if (pr && pr.catch) pr.catch(() => {});
        } catch (e) {}
    }
    function stopMusic() {
        if (bgMusic) { try { bgMusic.pause(); } catch (e) {} }
    }
    function toggleSound() {
        soundOn = !soundOn;
        $('soundWaves').style.display = soundOn ? '' : 'none';
        $('soundOff').style.display = soundOn ? 'none' : '';
        if (!soundOn) stopMusic();
        else if (playing) {   // bật lại âm thanh giữa ván: tạo/phát nhạc nền tiếp
            if (!bgMusic) startMusic();
            else { try { const p = bgMusic.play(); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
        }
    }
    function tone(freq, dur, type, delay, gain) {
        if (!soundOn) return;
        try {
            audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const t0 = audioCtx.currentTime + (delay || 0);
            const o = audioCtx.createOscillator(), g = audioCtx.createGain();
            o.type = type || 'sine'; o.frequency.value = freq;
            g.gain.setValueAtTime(gain || 0.18, t0);
            g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(t0); o.stop(t0 + dur + 0.02);
        } catch (e) {}
    }
    const sfx = {
        hit()   { tone(660, .12, 'triangle', 0); tone(990, .18, 'triangle', .09); },
        wrong() { tone(200, .25, 'sawtooth', 0, .12); tone(150, .3, 'sawtooth', .12, .1); }
    };
    function isFullscreen() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
    function toggleFullscreen() {
        const el = document.documentElement;
        try {
            const fn = isFullscreen()
                ? (document.exitFullscreen || document.webkitExitFullscreen)
                : (el.requestFullscreen || el.webkitRequestFullscreen);
            if (!fn) return;
            const p = fn.call(isFullscreen() ? document : el);
            if (p && p.catch) p.catch(() => {});
        } catch (e) {}
    }
    function syncFullscreenIcon() {
        const on = isFullscreen();
        $('fsExpand').style.display = on ? 'none' : '';
        $('fsExit').style.display = on ? '' : 'none';
        $('fsBtn').title = on ? 'Thoát toàn màn hình' : 'Toàn màn hình';
    }
    document.addEventListener('fullscreenchange', syncFullscreenIcon);
    document.addEventListener('webkitfullscreenchange', syncFullscreenIcon);

    // ===================== Dữ liệu phép tính =====================
    const items = [];
    EXPRESSIONS.forEach(raw => {
        const m = String(raw).replace(/[−–—]/g, '-').match(/^\s*(\d+)\s*([+-])\s*(\d+)\s*$/);
        if (!m) { console.warn('Phép tính không hợp lệ, đã bỏ qua:', raw); return; }   // tránh làm hỏng cả trò chơi khi gõ sai
        const a = Number(m[1]), b = Number(m[3]);
        items.push({ text: `${a} ${m[2] === '-' ? '−' : '+'} ${b}`, value: m[2] === '-' ? a - b : a + b });
    });

    // ===================== Trạng thái =====================
    const field = document.getElementById('field');
    const $ = id => document.getElementById(id);
    const rand = (a, b) => a + Math.random() * (b - a);
    let mosquitoes = [];
    const totalCorrect = items.filter(i => i.value === TARGET).length;   // số con muỗi đúng cần diệt
    let correct = 0, wrong = 0;
    let playing = false, locked = true, lastT = 0, gameId = 0;

    function mosquitoSize() {
        const W = field.clientWidth, H = field.clientHeight;
        return Math.max(96, Math.min(230, Math.min(W * 0.17, H * 0.36)));
    }

    function makeMosquito(item, col, row, cols, rows) {
        const W = field.clientWidth, H = field.clientHeight, w = mosquitoSize();
        const el = document.createElement('div');
        el.className = 'muoi';
        el.style.setProperty('--w', w + 'px');
        el.style.width = w + 'px';
        el.innerHTML = `<div class="muoi-inner"><img alt="" draggable="false"><span class="calc"></span></div>`;
        const inner = el.firstChild, img = inner.querySelector('img'), calc = inner.querySelector('.calc');
        img.addEventListener('error', () => inner.classList.add('noimg'));
        img.src = MOSQUITO_IMG;
        calc.textContent = item.text;
        calc.style.left = LABEL_BOX.left + '%'; calc.style.top = LABEL_BOX.top + '%';
        calc.style.width = LABEL_BOX.width + '%'; calc.style.height = LABEL_BOX.height + '%';
        field.appendChild(el);

        const cw = W / cols, ch = H / rows;
        const x = Math.max(0, Math.min(W - w, col * cw + (cw - w) / 2 + rand(-cw * .12, cw * .12)));
        const y = Math.max(0, Math.min(H - w, row * ch + (ch - w) / 2 + rand(-ch * .1, ch * .1)));
        const speed = Math.max(55, Math.min(110, W * 0.06)) * MOSQUITO_SPEED * rand(.8, 1.2);
        const ang = rand(0, Math.PI * 2);
        return { el, item, x, y, w, speed, vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed, alive: true };
    }

    // ===================== Luồng game =====================
    function startGame() {
        gameId++;
        $('startScreen').classList.remove('show');
        $('endScreen').classList.remove('show');
        mosquitoes.forEach(m => m.el.remove()); mosquitoes = [];
        correct = 0; wrong = 0; playing = true;
        startMusic();
        if (soundOn) tone(1, .01, 'sine', 0, .0001);   // đánh thức âm thanh trên trình duyệt

        const list = items.slice().sort(() => Math.random() - 0.5);
        const cols = list.length <= 4 ? 2 : 3, rows = Math.ceil(list.length / cols);
        list.forEach((item, i) => mosquitoes.push(makeMosquito(item, i % cols, Math.floor(i / cols), cols, rows)));
        locked = false;
    }

    function endGame() {
        locked = true; playing = false;
        const myGame = gameId;
        setTimeout(() => {
            if (myGame !== gameId) return;   // giáo viên đã quay về màn hình bắt đầu
            showResult();
        }, Math.max(1500, Math.min(TOAST_MS, toastUntil - performance.now() + 400)));   // chờ đọc xong thông báo sai (nếu có)
    }

    // Màn hình kết quả cho học sinh lớp 1: chỉ nhìn số sao (đúng hết = 3 sao, nhầm 1 con = 2 sao, nhầm 2 con trở lên = 1 sao)
    const STAR_PATH = 'M50 6 L62 36 L94 38 L69 58 L78 90 L50 72 L22 90 L31 58 L6 38 L38 36 Z';
    const RAYS = Array.from({ length: 12 }, (_, k) => {   // 12 tia sáng quanh mỗi sao, tia dài và ngắn xen kẽ
        const a = (k * 30 - 90) * Math.PI / 180, r1 = 56, r2 = k % 2 ? 66 : 76;
        const f = n => n.toFixed(1);
        return `<path class="ray${k % 2 ? ' b' : ''}" pathLength="1" d="M${f(50 + r1 * Math.cos(a))} ${f(53 + r1 * Math.sin(a))} L${f(50 + r2 * Math.cos(a))} ${f(53 + r2 * Math.sin(a))}"/>`;
    }).join('');
    function showResult() {
        mosquitoes.forEach(m => m.el.remove()); mosquitoes = [];
        $('toast').classList.remove('show');
        const stars = wrong <= STARS_3_MAX_WRONG ? 3 : wrong <= STARS_2_MAX_WRONG ? 2 : 1;
        const box = $('endStars');
        box.style.setProperty('--rd', (0.4 + (stars - 1) * 0.9 + 1.0) + 's');   // tia sáng chỉ tỏa ra sau khi sao cuối cùng đã hiện xong
        box.innerHTML = [0, 1, 2].map(i => {
            const on = i < stars;
            return `<div class="st ${on ? 'on' : 'off'}${i === 1 ? ' mid' : ''}" style="--d:${(0.4 + i * 0.9).toFixed(2)}s"><svg viewBox="0 0 100 100" aria-hidden="true">${on ? `<g class="rays">${RAYS}</g>` : ''}<path class="star" d="${STAR_PATH}"/></svg></div>`;
        }).join('');
        $('endSub').innerHTML = wrong > 0 ? `Nhầm <span class="num">${wrong}</span> con` : '';
        $('endScreen').classList.add('show');
        stopMusic();
    }

    // Cơ chế ẩn cho giáo viên: chạm nhanh 3 lần vào chữ "Chiến" trên thanh tiêu đề để quay về màn hình bắt đầu
    function backToStart() {
        gameId++; locked = true; playing = false;
        mosquitoes.forEach(m => m.el.remove()); mosquitoes = [];
        $('toast').classList.remove('show');
        stopMusic();
        $('endScreen').classList.remove('show');
        $('startScreen').classList.add('show');
    }
    (function () {
        let taps = 0, timer = null;
        $('secretTap').addEventListener('click', () => {
            taps++; clearTimeout(timer);
            if (taps >= 3) { taps = 0; backToStart(); return; }
            timer = setTimeout(() => { taps = 0; }, 700);
        });
    })();

    // Chặn thu phóng bằng hai ngón tay trên Safari/iPad (các em chạm nhầm làm vỡ bố cục)
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));

    // ===================== Đập muỗi =====================
    let toastUntil = 0;
    function showToast(text) {
        const t = $('toast'); t.textContent = text; t.classList.add('show');
        clearTimeout(showToast.timer);
        toastUntil = performance.now() + TOAST_MS;
        showToast.timer = setTimeout(() => t.classList.remove('show'), TOAST_MS);
    }
    function addFx(cls, x, y, text) {
        const d = document.createElement('div');
        d.className = cls; d.style.left = x + 'px'; d.style.top = y + 'px';
        if (text) d.textContent = text;
        field.appendChild(d);
        setTimeout(() => d.remove(), 1300);
    }

    field.addEventListener('pointerdown', e => {
        if (locked) return;
        const r = field.getBoundingClientRect();
        const px = e.clientX - r.left, py = e.clientY - r.top;
        // chọn con muỗi gần điểm chạm nhất
        let best = null, bestD = 1;
        for (const m of mosquitoes) {
            if (!m.alive) continue;
            const dx = (px - (m.x + m.w / 2)) / (m.w * 0.5), dy = (py - (m.y + m.w * 0.5)) / (m.w * 0.48);
            const d = Math.max(Math.abs(dx), Math.abs(dy));
            if (d < bestD) { bestD = d; best = m; }
        }
        if (best) swat(best);
    });

    function swat(m) {
        const cx = m.x + m.w / 2, cy = m.y + m.w / 2;
        const ok = m.item.value === TARGET;
        m.alive = false;                       // đúng hay sai, con muỗi đều biến mất
        m.el.classList.add('gone');
        setTimeout(() => m.el.remove(), 700);
        if (ok) {
            correct++;
            addFx('burst', cx, cy);
            addFx('pop-text', cx, m.y, `${m.item.text} = ${m.item.value}`);
            sfx.hit();
        } else {
            wrong++;
            addFx('burst bad', cx, cy);
            showToast(`Chưa đúng: ${m.item.text} = ${m.item.value}. Các bạn cẩn thận hơn nhé!`);
            sfx.wrong();
        }
        if (correct >= totalCorrect) endGame();   // diệt hết muỗi đúng thì kết thúc
    }

    // ===================== Muỗi bay =====================
    function tick(t) {
        const dt = Math.min(0.05, (t - lastT) / 1000 || 0); lastT = t;
        const W = field.clientWidth, H = field.clientHeight;
        const live = mosquitoes.filter(m => m.alive);
        for (const m of live) {   // đổi hướng nhẹ nhàng
            const rot = (Math.random() - 0.5) * 2.2 * dt, c = Math.cos(rot), s = Math.sin(rot);
            const vx = m.vx * c - m.vy * s, vy = m.vx * s + m.vy * c;
            m.vx = vx; m.vy = vy;
        }
        // đẩy nhau ra để không chồng lên nhau
        for (let i = 0; i < live.length; i++) for (let j = i + 1; j < live.length; j++) {
            const a = live[i], b = live[j];
            const dx = b.x - a.x, dy = b.y - a.y, min = a.w * 0.82, d = Math.hypot(dx, dy) || 1;
            if (d < min) {
                const ux = dx / d, uy = dy / d, over = (min - d) / 2;
                a.x -= ux * over; a.y -= uy * over; b.x += ux * over; b.y += uy * over;
                const va = a.vx * ux + a.vy * uy, vb = b.vx * ux + b.vy * uy;
                if (va > vb) { a.vx += (vb - va) * ux; a.vy += (vb - va) * uy; b.vx += (va - vb) * ux; b.vy += (va - vb) * uy; }
            }
        }
        for (const m of live) {
            const sp = Math.hypot(m.vx, m.vy) || 1, k = m.speed / sp;   // giữ tốc độ không đổi
            m.vx *= k; m.vy *= k;
            m.x += m.vx * dt; m.y += m.vy * dt;
            const maxX = Math.max(0, W - m.w), maxY = Math.max(0, H - m.w * 0.95);
            if (m.x < 0) { m.x = 0; m.vx = Math.abs(m.vx); } else if (m.x > maxX) { m.x = maxX; m.vx = -Math.abs(m.vx); }
            if (m.y < 0) { m.y = 0; m.vy = Math.abs(m.vy); } else if (m.y > maxY) { m.y = maxY; m.vy = -Math.abs(m.vy); }
            m.el.style.transform = `translate(${m.x.toFixed(1)}px, ${m.y.toFixed(1)}px)`;
        }
        requestAnimationFrame(tick);
    }

    window.addEventListener('resize', () => {
        const w = mosquitoSize();
        mosquitoes.forEach(m => { m.w = w; m.el.style.width = w + 'px'; m.el.style.setProperty('--w', w + 'px'); });
    });

    // ===================== Khởi tạo =====================
    if (!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen)) $('fsBtn').style.display = 'none';   // trình duyệt không hỗ trợ (ví dụ iPhone)
    $('targetNum').textContent = TARGET;
    $('startImg').src = START_IMG;
    for (let i = 0; i < 4; i++) {   // vài đám mây trang trí
        const c = document.createElement('div');
        c.className = 'cloud';
        c.style.top = (4 + i * 17) + '%'; c.style.animationDuration = (60 + i * 25) + 's'; c.style.animationDelay = (-i * 22) + 's';
        field.prepend(c);
    }
    requestAnimationFrame(tick);
</script>
</body>
</html>
